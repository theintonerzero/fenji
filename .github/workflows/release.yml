name: Release

# fenji-server's release archives (M4 hosting spec §3.7, H3): one for each target, from its own
# runner, packed by scripts/package-server.sh. And the desktop launcher's bundles (launcher spec
# §3.8): the AppImage, the Windows installer and the macOS app, each from its own runner, with its
# third-party notices (scripts/launcher-notices.sh, #341) and, on a tag, signed for the updater with
# Fenji's release key, with the updater's latest.json. Each job that makes a file reports its sum
# among its outputs, and the jobs that sign take only the files reported
# (scripts/check-release-files.sh). A v* tag attaches them all, with SHA256SUMS and its signature,
# SHA256SUMS.sig, to the tag's draft release, which the release steps in docs/development.md check
# and publish. A pull request that changes this workflow, the scripts it runs, what they pack
# (deploy/start, deploy/archive, deploy/systemd, deploy/caddy, deploy/launcher, the launcher's
# bundle settings) or the pinned tools builds everything and checks it against the jobs' reports,
# without signing or publishing (Ruling HP4), as does a run by hand; its files stay with the run.
on:
  push:
    tags: ['v*']
  pull_request:
    branches: [dev, main]
    paths:
      - .github/workflows/release.yml
      - scripts/package-server.sh
      - scripts/launcher-notices.sh
      - scripts/check-notices.sh
      - scripts/launcher-latest-json.sh
      - scripts/check-release-files.sh
      - scripts/release-notes.sh
      - scripts/sign-sums.sh
      - scripts/versions.env
      - apps/launcher/src-tauri/tauri.conf.json
      - deploy/start/**
      - deploy/archive/**
      - deploy/systemd/**
      - deploy/caddy/**
      - deploy/launcher/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A job of its own for each server target, rather than a matrix: each job reports its archive, as
  # "SHA-256 file name", in its own output, report. Any job of the run can replace an artifact, but
  # none can set another job's outputs, and the legs of a matrix would share theirs: so the jobs
  # that sign take an archive only when it's the one its own job reported
  # (scripts/check-release-files.sh; the hosting spec's Amendment D, HD2). The jobs share their
  # steps (server-steps); CI's notices job reads the targets from their TARGET lines.
  server-x86_64-linux:
    name: x86_64-unknown-linux-musl
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      report: ${{ steps.pack.outputs.report }}
    defaults: &bash
      run:
        shell: bash
    env:
      TARGET: x86_64-unknown-linux-musl
    steps: &server-steps
      # Windows runners check out with CR LF line ends, and the build embeds files: the example
      # config, and the database's migrations, whose checksums a database is checked against. With
      # the repository's LF everywhere, every system builds from the same bytes, and a data folder
      # can move between them.
      - name: Check out with the repository's line ends
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml, and the target
        run: |
          rustup set profile minimal
          rustup toolchain install
          rustup target add "$TARGET"
          rustc -vV
      - name: Install cargo-about, for the archive's third-party notices
        run: |
          source scripts/versions.env
          # Its program is behind the cli feature: without it, cargo install builds nothing.
          cargo install --locked --features cli cargo-about --version "$CARGO_ABOUT_VERSION"
          cargo about --version
      - name: Install musl-tools, for the static Linux builds' C code
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          # cc looks for aarch64-linux-musl-gcc for the ARM target, and Ubuntu's musl-tools has
          # musl-gcc only.
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --locked -p fenji-server --target "$TARGET"
      - name: Pack
        id: pack
        run: |
          bin=target/$TARGET/release/fenji-server
          exe=fenji-server
          script=start-server.sh
          case $TARGET in
            *-windows-*) bin=$bin.exe exe=fenji-server.exe script=start-server.bat ;;
            *-apple-darwin) script=start-server.command ;;
          esac
          # The archive carries the binary's own version, which a tag must match.
          version=$("$bin" --version | tr -d '\r')
          version=${version##* }
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "v$version" ]]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match fenji-server's version, $version."
            exit 1
          fi
          archive=$(scripts/package-server.sh "$version" "$TARGET" "$bin" dist)
          # What the archive must hold, worked out here rather than taken from the script, against
          # what this system's own tools find in it: GNU tar, bsdtar on macOS, 7-Zip on Windows.
          name=fenji-server-$version-$TARGET
          files=("$exe" "$script" fenji.example.toml README.txt LICENSE SOURCE.txt THIRD-PARTY-NOTICES.txt)
          # A Linux or macOS archive also carries the update script (the hosting spec's Amendment B).
          case $TARGET in
            *-windows-*) ;;
            *) files+=(update-server.sh) ;;
          esac
          # A Linux archive also carries the VPS's units and its Caddyfile (#359).
          case $TARGET in
            *-linux-*)
              files+=(systemd/ systemd/fenji.service systemd/fenji-backup.service systemd/fenji-backup.timer)
              files+=(caddy/ caddy/Caddyfile) ;;
          esac
          deps=$(cargo tree --locked -p fenji-server --target "$TARGET" -e normal --prefix none)
          if grep -q '^fenji-oodle v' <<< "$deps"; then
            files+=(fenji-oodle/ fenji-oodle/COPYING fenji-oodle/NOTICE)
          fi
          want=$(for f in "" "${files[@]}"; do printf '%s/%s\n' "$name" "$f"; done | LC_ALL=C sort)
          case $archive in
            # 7-Zip lists a block for each entry; a folder's Path has no slash at its end, and on
            # Windows its separators are backslashes.
            *.zip)
              got=$(7z l -slt "$archive" | tr -d '\r' |
                awk -F ' = ' '$1 == "Path" { p = $2; gsub(/\\/, "/", p) } $1 == "Folder" { print p ($2 == "+" ? "/" : "") }' |
                LC_ALL=C sort) ;;
            *) got=$(tar -tzf "$archive" | LC_ALL=C sort) ;;
          esac
          if [[ $got != "$want" ]]; then
            echo "::error::$archive doesn't hold exactly what it should."
            diff <(echo "$want") <(echo "$got") || true
            exit 1
          fi
          echo "$archive holds:"
          echo "$got"
          # The archive, as this job's report (above).
          if command -v sha256sum > /dev/null; then sum=$(sha256sum -b "$archive"); else sum=$(shasum -a 256 -b "$archive"); fi
          echo "report=${sum%% *} ${archive##*/}" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fenji-server-${{ env.TARGET }}
          path: dist/
          if-no-files-found: error

  server-aarch64-linux:
    name: aarch64-unknown-linux-musl
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    outputs:
      report: ${{ steps.pack.outputs.report }}
    defaults: *bash
    env:
      TARGET: aarch64-unknown-linux-musl
    steps: *server-steps

  server-x86_64-windows:
    name: x86_64-pc-windows-msvc
    runs-on: windows-2025
    timeout-minutes: 45
    outputs:
      report: ${{ steps.pack.outputs.report }}
    defaults: *bash
    env:
      TARGET: x86_64-pc-windows-msvc
      # The C runtime linked in, so the server runs on a Windows without the Visual C++
      # Redistributable.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    steps: *server-steps

  server-aarch64-macos:
    name: aarch64-apple-darwin
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      report: ${{ steps.pack.outputs.report }}
    defaults: *bash
    env:
      TARGET: aarch64-apple-darwin
    steps: *server-steps

  # A job of its own for each launcher bundle, reporting it as the server jobs report their
  # archives. TRIPLE is the bundle's Rust target, which its third-party notices are for.
  launcher-appimage:
    name: launcher (appimage)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      report: ${{ steps.collect.outputs.report }}
    defaults: *bash
    env:
      BUNDLE: appimage
      TRIPLE: x86_64-unknown-linux-gnu
    steps: &launcher-steps
      - name: Check out with the repository's line ends
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: |
          rustup set profile minimal
          rustup toolchain install
          rustc -vV
      - name: Tauri's Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Before tauri-cli's install: the cache brings back ~/.cargo/bin, and cargo install then
      # finds the pinned version there.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/launcher/src-tauri
          key: ${{ env.BUNDLE }}
      - name: pnpm, tauri-cli and cargo-about, at the versions scripts/versions.env pins
        run: |
          source scripts/versions.env
          npm install -g "pnpm@$PNPM_VERSION"
          cargo install --locked tauri-cli --version "$TAURI_CLI_VERSION"
          cargo tauri --version
          # Its program is behind the cli feature: without it, cargo install builds nothing.
          cargo install --locked --features cli cargo-about --version "$CARGO_ABOUT_VERSION"
          cargo about --version
      - name: The view's packages
        working-directory: apps/launcher
        run: pnpm install --frozen-lockfile
      # After the view's packages, whose licences they carry too (#341).
      - name: The bundle's third-party notices
        run: scripts/launcher-notices.sh "$TRIPLE" "$RUNNER_TEMP/notices/THIRD-PARTY-NOTICES.txt"
      # The build never sees the release key: the sign job, in the tag-only release environment,
      # signs the bundles afterwards (the launcher's final review, Important 2), so no cache, build
      # script or npm package here can reach it.
      - name: Build the bundle
        working-directory: apps/launcher/src-tauri
        run: |
          version=$(sed -n '/^\[package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "v$version" ]]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match the launcher's version, $version."
            exit 1
          fi
          # Every bundle carries the notices at the root of its resources, as THIRD-PARTY-NOTICES.txt,
          # where the launcher's Settings › About finds them (Tauri's map form: the file, then its
          # place). Git Bash's backslashes become slashes; Tauri drops a Windows path's drive letter,
          # so the file must be on the checkout's drive, as RUNNER_TEMP is. No updater artifacts:
          # the AppImage and the installer are their own, and the app's tarball is packed below.
          notices=${RUNNER_TEMP//\\//}/notices/THIRD-PARTY-NOTICES.txt
          config=$(node -e '
            const [notices] = process.argv.slice(1);
            const bundle = { resources: { [notices]: "THIRD-PARTY-NOTICES.txt" }, createUpdaterArtifacts: false };
            process.stdout.write(JSON.stringify({ bundle }));
          ' "$notices")
          echo "The bundle's configuration, over tauri.conf.json: $config"
          cargo tauri build --bundles "$BUNDLE" --ci --config "$config"
      - name: Collect the bundle
        id: collect
        working-directory: apps/launcher/src-tauri/target/release/bundle
        run: |
          out=$GITHUB_WORKSPACE/dist-launcher
          mkdir -p "$out"
          case $BUNDLE in
            appimage) found=(appimage/*.AppImage) ;;
            nsis) found=(nsis/*-setup.exe) ;;
            app)
              # The updater's form of the app: the .app in a gzipped tarball, as Tauri's own.
              tar -czf macos/Fenji.app.tar.gz -C macos Fenji.app
              found=(macos/*.app.tar.gz) ;;
          esac
          if [[ ${#found[@]} != 1 || ! -f ${found[0]} ]]; then
            echo "::error::Want one $BUNDLE bundle, found: ${found[*]}"
            exit 1
          fi
          cp -- "${found[0]}" "$out/"
          ls -l "$out"
          # The bundle, as this job's report (above).
          if command -v sha256sum > /dev/null; then sum=$(sha256sum -b "${found[0]}"); else sum=$(shasum -a 256 -b "${found[0]}"); fi
          echo "report=${sum%% *} ${found[0]##*/}" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fenji-launcher-${{ env.BUNDLE }}
          path: dist-launcher/
          if-no-files-found: error

  launcher-nsis:
    name: launcher (nsis)
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      report: ${{ steps.collect.outputs.report }}
    defaults: *bash
    env:
      BUNDLE: nsis
      TRIPLE: x86_64-pc-windows-msvc
    steps: *launcher-steps

  launcher-app:
    name: launcher (app)
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      report: ${{ steps.collect.outputs.report }}
    defaults: *bash
    env:
      BUNDLE: app
      TRIPLE: aarch64-apple-darwin
    steps: *launcher-steps

  # The launcher's updater key signs a tag's bundles here, and only here: its secrets live in the
  # release environment, whose deployment rule admits v* tags alone, so a branch's run can't read
  # them whatever its workflow says. tauri-cli is installed fresh, with no cache any run could have
  # written, before the key is in any environment; only the signing step holds it. It signs a bundle
  # only when it's the one the launcher job reported, and reports each signature in turn.
  sign:
    name: Sign the launcher's bundles
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [launcher-appimage, launcher-nsis, launcher-app]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    outputs:
      appimage: ${{ steps.sign.outputs.appimage }}
      nsis: ${{ steps.sign.outputs.nsis }}
      app: ${{ steps.sign.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain and tauri-cli, at the pinned versions, with no cache
        run: |
          rustup set profile minimal
          rustup toolchain install
          source scripts/versions.env
          cargo install --locked tauri-cli --version "$TAURI_CLI_VERSION"
          cargo tauri --version
      # Each bundle's artifact in a folder of its own, nothing merged.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fenji-launcher-*
          path: artifacts
      - name: Take only the bundles their own jobs reported
        env:
          LAUNCHER: >-
            {"appimage": ${{ toJSON(needs.launcher-appimage.outputs.report) }},
            "nsis": ${{ toJSON(needs.launcher-nsis.outputs.report) }},
            "app": ${{ toJSON(needs.launcher-app.outputs.report) }}}
        run: scripts/check-release-files.sh "${GITHUB_REF_NAME#v}" artifacts launcher
      - name: Sign each bundle with the release key
        id: sign
        working-directory: launcher
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ -z $TAURI_SIGNING_PRIVATE_KEY ]]; then
            echo "::error::The release environment has no TAURI_SIGNING_PRIVATE_KEY, so the bundles can't be signed."
            exit 1
          fi
          for f in *; do
            case $f in
              *.AppImage) bundle=appimage ;;
              *-setup.exe) bundle=nsis ;;
              *.app.tar.gz) bundle=app ;;
              *) echo "::error::$f isn't a bundle."; exit 1 ;;
            esac
            cargo tauri signer sign "$f" > /dev/null
            [[ -s $f.sig ]] || { echo "::error::$f has no signature."; exit 1; }
            # The signature, as this job's output for its bundle, which the sums job checks.
            sum=$(sha256sum -b "$f.sig")
            echo "$bundle=${sum%% *} $f.sig" | tee -a "$GITHUB_OUTPUT"
          done
          ls -l
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: launcher-signatures
          path: launcher/*.sig
          if-no-files-found: error

  sums:
    # Behind the owner's approval of the release environment, as sign is, in a job that builds and
    # installs nothing, so no third-party code runs beside the release's SSH key (the hosting spec's
    # Amendment D, HD2). It takes each file only when it's the one its own job reported, writes the
    # updater's latest.json with the tag's CHANGELOG.md section as its notes, and signs SHA256SUMS
    # over them all as SHA256SUMS.sig.
    name: Check the release's files, sum them, and sign the sums
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [server-x86_64-linux, server-aarch64-linux, server-x86_64-windows, server-aarch64-macos, launcher-appimage, launcher-nsis, launcher-app, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Each artifact in a folder of its own, nothing merged: the next step takes only what each
      # file's own job reported, and refuses anything else.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fenji-*
          path: artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: launcher-signatures
          path: artifacts/launcher-signatures
      - name: Take only the files their own jobs reported
        env:
          BUILD: >-
            {"x86_64-unknown-linux-musl": ${{ toJSON(needs.server-x86_64-linux.outputs.report) }},
            "aarch64-unknown-linux-musl": ${{ toJSON(needs.server-aarch64-linux.outputs.report) }},
            "x86_64-pc-windows-msvc": ${{ toJSON(needs.server-x86_64-windows.outputs.report) }},
            "aarch64-apple-darwin": ${{ toJSON(needs.server-aarch64-macos.outputs.report) }}}
          LAUNCHER: >-
            {"appimage": ${{ toJSON(needs.launcher-appimage.outputs.report) }},
            "nsis": ${{ toJSON(needs.launcher-nsis.outputs.report) }},
            "app": ${{ toJSON(needs.launcher-app.outputs.report) }}}
          SIGNED: ${{ toJSON(needs.sign.outputs) }}
        run: scripts/check-release-files.sh "${GITHUB_REF_NAME#v}" artifacts dist
      - name: Write the updater's latest.json, its notes the tag's changelog section
        run: |
          scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
          scripts/launcher-latest-json.sh "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/notes.md" dist
          cat dist/latest.json
      - name: The update script trusts a key the sums are signed with
        run: |
          trusted=$(sed -n "s/^RELEASE_KEY='\(.*\)'\$/\1/p" deploy/start/update-server.sh)
          if [[ -z $trusted ]] || ! grep -qxF -- "$trusted" deploy/allowed_signers; then
            echo "::error::The update script's RELEASE_KEY isn't a line of deploy/allowed_signers: scripts/set-release-key.sh puts the release key in (Amendment D, HD5)."
            exit 1
          fi
      - name: Write SHA256SUMS, sign it with the release's SSH key, and check the signature
        env:
          SSH_SIGNING_PRIVATE_KEY: ${{ secrets.SSH_SIGNING_PRIVATE_KEY }}
        run: scripts/sign-sums.sh dist deploy/allowed_signers
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error

  check:
    # A pull request's run, or one by hand, takes the release's files as the sums job would, so a
    # change that breaks a job's report fails here rather than on a tag. Nothing is signed.
    name: Check the files against their jobs' reports
    if: github.event_name != 'push'
    needs: [server-x86_64-linux, server-aarch64-linux, server-x86_64-windows, server-aarch64-macos, launcher-appimage, launcher-nsis, launcher-app]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fenji-*
          path: artifacts
      - name: Take only the files their own jobs reported
        env:
          BUILD: >-
            {"x86_64-unknown-linux-musl": ${{ toJSON(needs.server-x86_64-linux.outputs.report) }},
            "aarch64-unknown-linux-musl": ${{ toJSON(needs.server-aarch64-linux.outputs.report) }},
            "x86_64-pc-windows-msvc": ${{ toJSON(needs.server-x86_64-windows.outputs.report) }},
            "aarch64-apple-darwin": ${{ toJSON(needs.server-aarch64-macos.outputs.report) }}}
          LAUNCHER: >-
            {"appimage": ${{ toJSON(needs.launcher-appimage.outputs.report) }},
            "nsis": ${{ toJSON(needs.launcher-nsis.outputs.report) }},
            "app": ${{ toJSON(needs.launcher-app.outputs.report) }}}
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          scripts/check-release-files.sh "$version" artifacts dist

  publish:
    name: Attach to the draft release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [sums]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # makes the draft release and uploads its files
    steps:
      # For deploy/allowed_signers, which the check below reads.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # What the sums job put together: the archives, the bundles and their signatures, latest.json,
      # SHA256SUMS and SHA256SUMS.sig.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: dist
      - name: Attach only what the signature covers
        working-directory: dist
        run: |
          # As a host checks a release: the signature is the release key's, and every sum holds.
          env -u SSH_AUTH_SOCK ssh-keygen -q -Y verify -f "$GITHUB_WORKSPACE/deploy/allowed_signers" \
            -I fenji-release -n fenji-release -s SHA256SUMS.sig < SHA256SUMS > /dev/null
          sha256sum --strict -c SHA256SUMS
          # And nothing is attached that SHA256SUMS doesn't list.
          listed=$(awk '{ sub(/^\*/, "", $2); print $2 }' SHA256SUMS | LC_ALL=C sort)
          here=$(for f in *; do [[ $f == SHA256SUMS || $f == SHA256SUMS.sig ]] || echo "$f"; done | LC_ALL=C sort)
          if [[ $listed != "$here" ]]; then
            echo "::error::The files to attach aren't exactly those SHA256SUMS lists."
            diff <(echo "$listed") <(echo "$here") || true
            exit 1
          fi
      - name: Attach the archives and SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # A run started again after its tag moved still has the old commit's archives: they must
          # never replace the draft's files.
          tagged=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
          if [[ $tagged != "$GITHUB_SHA" ]]; then
            echo "::error::$TAG is now at $tagged, not at this run's commit, $GITHUB_SHA."
            exit 1
          fi
          # The tag's release, from the list of releases, which has the drafts: none yet, a draft
          # (a run again replaces its files), or a published one, which is never changed.
          draft=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.tag_name == env.TAG) | .draft')
          case $draft in
            "")
              prerelease=()
              if [[ $TAG == *-* ]]; then prerelease=(--prerelease); fi
              gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes "" "${prerelease[@]}" ;;
            true) ;;
            false)
              echo "::error::$TAG's release is already published, so its files stay as they are."
              exit 1 ;;
            *)
              echo "::error::$TAG has more than one release."
              exit 1 ;;
          esac
          gh release upload "$TAG" dist/* --clobber

name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  repo-hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No game content or RE artefacts
        run: scripts/check-forbidden-files.sh
      - name: Commit-subject check tests
        run: scripts/test-check-commit-subject.sh
      - name: Forbidden-file check tests
        run: scripts/test-check-forbidden-files.sh
      - name: Watchdog and runner tests
        run: |
          python3 -I scripts/spike/test-watchdog.py
          scripts/spike/test-run-client.sh
      - name: ShellCheck
        run: |
          sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh scripts/spike/*.sh .githooks/*
      - name: Network isolation self-test
        run: |
          sudo apt-get update
          # keyutils gives the self-test the keyctl CLI (the syscall-level key checks run without it).
          sudo apt-get install -y bubblewrap keyutils
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor by default; bwrap needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --version
          python3 -I scripts/spike/seccomp-deny-keys.py --disasm
          scripts/spike/test-isolated-run.sh

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: PR title is a Conventional Commit (it becomes the squash commit)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: scripts/check-commit-subject.sh "$TITLE"

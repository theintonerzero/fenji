name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # tools/oodle-helper's dll.rs, the workspace's only unsafe code, builds for Windows only.
      - run: cargo clippy -p fenji-oodle-helper --target x86_64-pc-windows-gnu --locked -- -D warnings
      # fenji-data without its `oodle` feature, as tools/oodle-helper builds it.
      - run: cargo clippy -p fenji-data --no-default-features --all-targets --locked -- -D warnings
      # Its tests without it too: --workspace turns `oodle` on, so codec.rs's no-feature test runs only here.
      - run: cargo test -p fenji-data --no-default-features --locked
      - name: The program that loads Epic's Oodle DLL links no GPL code (fenji-oodle)
        run: |
          deps=$(cargo tree -p fenji-oodle-helper --target x86_64-pc-windows-gnu -e normal --prefix none --locked)
          if grep -q '^fenji-oodle v' <<< "$deps"; then
            echo "fenji-oodle (GPL-3.0-or-later) is in tools/oodle-helper's build" >&2
            exit 1
          fi
      - run: cargo test --workspace --locked
      # The tests write the launcher's golden snapshots' types (ts-rs) and read its snapshots: the
      # committed files must be what they write (launcher plan LP2, LP13).
      - name: The launcher's golden snapshots and generated types are current
        run: |
          stale=$(git status --porcelain -- apps/launcher/fixtures apps/launcher/src/gen)
          if [ -n "$stale" ]; then
            echo "Run fenji-launcher's tests (FENJI_BLESS=1 for the snapshots) and commit:" >&2
            echo "$stale" >&2
            git diff -- apps/launcher/fixtures apps/launcher/src/gen >&2
            exit 1
          fi

  # The desktop launcher (apps/launcher; launcher spec §3.1): its view, and its Tauri shell, a
  # workspace of its own whose webview needs WebKitGTK to build.
  launcher:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Tauri's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: pnpm, at the version scripts/versions.env pins
        run: npm install -g pnpm@12.11.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/launcher/src-tauri
      - name: The view
        working-directory: apps/launcher
        run: |
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm test
          pnpm run build
          node scripts/check-licences.mjs
      # After the view's build: the shell embeds its files (tauri.conf.json's frontendDist).
      - name: The shell
        working-directory: apps/launcher/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
      - name: The shell's licences, advisories and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: apps/launcher/src-tauri/Cargo.toml
      - name: The launcher's versions are the workspace's
        run: scripts/check-launcher-version.sh

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  repo-hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # a PR's commits, and dev's, for the session-link check
      - name: No game content or RE artefacts
        run: scripts/check-forbidden-files.sh
      - name: Commit-subject check tests
        run: scripts/test-check-commit-subject.sh
      - name: Session-link check tests
        run: scripts/test-check-no-session-links.sh
      - name: Release packaging tests
        run: scripts/test-package-server.sh
      - name: The launcher's latest.json tests
        run: scripts/test-launcher-latest-json.sh
      - name: No session links in the PR's title, description or new commits
        # In this job, not pr-title, because this one is a required check on dev and main.
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-pr-session-links.sh "$BASE_SHA" "$HEAD_SHA" origin/dev
      - name: A Turkish locale for the locale-proofing tests
        # Its dotless-i lowercasing is what the forbidden-file and MIT-SHM tests guard against.
        run: |
          sudo locale-gen tr_TR.UTF-8
          locale -a | grep -qi '^tr_TR.utf8$'
      - name: Forbidden-file check tests
        run: scripts/test-check-forbidden-files.sh
      - name: Launcher version check tests
        run: scripts/test-check-launcher-version.sh
      - name: Watchdog and runner tests
        run: |
          python3 -I scripts/spike/test-watchdog.py
          scripts/spike/test-run-client.sh
          scripts/spike/test-run-bare.sh
          scripts/spike/test-run-oodle-helper.sh
      - name: ShellCheck
        run: |
          sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh scripts/spike/*.sh .githooks/* deploy/start/*.sh deploy/start/*.command
      - name: Network isolation self-test
        run: |
          sudo apt-get update
          # keyutils gives the self-test the keyctl CLI (the syscall-level key checks run without it).
          sudo apt-get install -y bubblewrap keyutils
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor by default; bwrap needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --version
          python3 -I scripts/spike/seccomp-deny-keys.py --disasm
          scripts/spike/test-isolated-run.sh
      - name: Bare runner's live namespace probes
        # After the step that installs bwrap and lifts AppArmor's restriction. The namespace binds
        # the display's socket, so a stand-in listens at X99; FENJI_REQUIRE_LIVE_PROBES=1 makes a
        # skip a failure.
        run: |
          sudo install -d -m 1777 /tmp/.X11-unix
          python3 -I -c 'import socket, sys, time
          s = socket.socket(socket.AF_UNIX)
          s.bind(sys.argv[1])
          s.listen()
          time.sleep(900)' /tmp/.X11-unix/X99 < /dev/null > /dev/null 2>&1 &
          x99=$!
          trap 'kill "$x99"' EXIT
          for _ in $(seq 50); do [ -S /tmp/.X11-unix/X99 ] && break; sleep 0.1; done
          FENJI_REQUIRE_LIVE_PROBES=1 scripts/spike/test-run-bare.sh

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: PR title is a Conventional Commit (it becomes the squash commit)
        env:
          TITLE: ${{ github.event.pull_request.title }}
          PR: ${{ github.event.pull_request.number }}
        run: scripts/check-commit-subject.sh "$TITLE" "$PR"

[package]
name = "fenji-launcher-app"
description = "Fenji's desktop launcher: the Tauri shell over fenji-launcher's model"
version = "0.5.3"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-or-later"
publish = false

# A workspace of its own, outside the repository's (launcher spec §3.1): building the webview needs
# WebKitGTK's development packages on Linux, which the other builds and the cloud agents don't.
[workspace]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
fenji-launcher = { path = "../../../crates/fenji-launcher" }
# Only a newer launcher is installed (updates.rs, `newer`).
semver = "1.0.28"
# tauri::generate_context!() writes code that uses it.
serde_json = "1.0.145"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.4"
# Without its default `zip` feature: that only unpacks zipped Windows updates and gzipped AppImages,
# which Fenji's releases never make (the NSIS installer and the AppImage as they are), and it pulls in
# zip 4.x, which RUSTSEC-2026-0367, -0368 and -0369 cover. macOS's .app.tar.gz needs no feature.
tauri-plugin-updater = { version = "2.14.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
tokio = { version = "1.53.2", features = ["sync"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

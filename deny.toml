# cargo-deny: dependency licences, RustSec advisories, duplicate/wildcard bans, allowed sources.
# Run: cargo deny check

[graph]
all-features = true

[advisories]
ignore = []

[licenses]
# Permissive licences only. Adding one is a deliberate `chore(deps)` change.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
# Our own crates are `publish = false`.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

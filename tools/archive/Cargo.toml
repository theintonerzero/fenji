[package]
name = "fenji-archive"
description = "Reads the SoLO data archives' structure (index chains, records, blob headers, _index and its paths), extracts files and dumps the design tables, decoding Oodle natively or through the sandboxed helper's spool; counts Oodle chunk headers, and verifies every Oodle block against the client's DLL; writes only under re/"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "archive"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
fenji-data.workspace = true
fenji-oodle = { path = "../../crates/fenji-oodle" }
sha1.workspace = true

[dev-dependencies]
fenji-data = { workspace = true, features = ["test-util"] }
tempfile.workspace = true

[lints]
workspace = true

[package]
name = "fenji-oodle-helper"
description = "Decodes spooled Oodle LZ blocks with the client's own oo2core_6_win64.dll, and compresses Fenji's synthetic test fixtures with it, under Wine inside the sandbox only (M2 spec §6, gate #39 route c)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "oodle-helper"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
libloading.workspace = true

[dev-dependencies]
tempfile.workspace = true

# Deviation D1: not the workspace's `forbid`, so that dll.rs alone may allow it.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

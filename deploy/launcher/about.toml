# cargo-about's configuration, for the THIRD-PARTY-NOTICES.txt that scripts/launcher-notices.sh
# writes into each of the launcher's bundles: the licence text of every crate the Tauri shell's build
# links, or runs in its proc-macros, for the bundle's target. The shell is a workspace of its own
# (apps/launcher/src-tauri), with its own lock and deny.toml; deploy/archive/about.toml is the
# server's, under the same rules.

# apps/launcher/src-tauri/deny.toml's [licenses] allow list, in the same order:
# scripts/test-launcher-notices.sh fails when the two differ, so change both together. Where a crate
# offers a choice (MIT OR Apache-2.0), the first accepted licence is the one whose text the notices
# carry. A licence whose standard text writes its copyright line with template fields that
# scripts/check-notices.sh doesn't look for yet needs them added there.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]

# Not the crates that only build scripts or tests use. Proc-macros, which the build runs rather than
# links, are in, with the crates they use: cargo-about doesn't tell them from linked crates.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# The shell and fenji-launcher aren't published, and are under Fenji's licence.
private = { ignore = true }

# Clarifications, for the crates whose own licence text cargo-about can't find or read on one of the
# bundles' targets (x86_64-unknown-linux-gnu, x86_64-pc-windows-msvc, aarch64-apple-darwin). Without
# one, it puts in the licence's standard text, whose MIT and BSD copyright lines are templates
# ("Copyright (c) <year> <copyright holders>", "<owner>"), and scripts/check-notices.sh then refuses
# the notices (#328, #341). Each gives the crate's whole licence expression, and the text of the
# licence the notices carry for it, which `accepted` decides. A clarification is for every version of
# its crate, and its checksum is of the text it takes. When an update changes that text, cargo-about
# only warns and goes back to the standard text, so the notices are refused until the checksum is
# updated; so they are when a `git` file, which cargo-about fetches from GitHub each time, can't be
# fetched. A target that doesn't link a crate (windows-sys on Linux) gets a warning about that
# crate's clarification.

# alloc-stdlib packages no licence file: its repository's LICENSE (git: the file at the commit the
# crate's .cargo_vcs_info.json names), the same BSD text as brotli-decompressor's.
[alloc-stdlib.clarify]
license = "BSD-3-Clause"

[[alloc-stdlib.clarify.git]]
path = "LICENSE"
license = "BSD-3-Clause"
checksum = "c0c56f26d9c051cac4d200c34c84e7ae9aaa853e01a982a1df08b09931e518ae"

# brotli-decompressor is BSD-3-Clause OR MIT, but its package and its repository only ever had the
# BSD text, and `accepted` would pick MIT: the notices take BSD-3-Clause, whose text it ships.
[brotli-decompressor.clarify]
license = "BSD-3-Clause"

[[brotli-decompressor.clarify.files]]
path = "LICENSE"
license = "BSD-3-Clause"

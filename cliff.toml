# git-cliff configuration: generates CHANGELOG.md (Keep a Changelog 1.1.0) from Conventional Commits.
# CHANGELOG.md is generated, never hand-edited. Release: git cliff --tag vX.Y.Z -o CHANGELOG.md
# Preview unreleased changes: git cliff --unreleased   (see docs/development.md)
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog\n
All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.breaking %}**BREAKING** {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first | trim }}\
    {% endfor %}
{% endfor %}\n
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
# Groups are Keep a Changelog sections; the HTML comments fix their order and are stripped on render.
commit_parsers = [
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore\\(deps\\)", group = "<!-- 2 -->Changed" },
    { message = "^feat", group = "<!-- 0 -->Added" },
    { message = "^fix", group = "<!-- 4 -->Fixed" },
    { message = "^perf", group = "<!-- 2 -->Changed" },
    { message = "^refactor", group = "<!-- 2 -->Changed" },
    { message = "^revert", group = "<!-- 3 -->Removed" },
    { message = "^docs", group = "<!-- 5 -->Documentation" },
    { message = "^(test|ci|build|style|chore)", skip = true },
]
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+.*"
topo_order = false
sort_commits = "oldest"

[workspace]
resolver = "3"
members = ["tools/stub", "tools/luatool", "tools/archive", "tools/oodle-helper", "crates/fenji-data", "crates/fenji-lua", "crates/fenji-proto"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
aes = "0.9.3"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
fenji-data = { path = "crates/fenji-data" }
fenji-lua = { path = "crates/fenji-lua" }
fenji-proto = { path = "crates/fenji-proto" }
libloading = "0.9.0"
lz4_flex = { version = "0.14.0", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
mlua = { version = "0.12.2", features = ["lua53", "vendored"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "io-util", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

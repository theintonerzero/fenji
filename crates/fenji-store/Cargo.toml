[package]
name = "fenji-store"
description = "Fenji's SQLite store: accounts, invites, sessions, game tokens and characters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }

[features]
# Store::hold_write_lock, for other crates' tests of what writers see while a transaction is open,
# Store::hold_pool, for their tests of what waits on a store whose pool is all in use, and
# Store::break_bans, for their tests of a store that can't read bans.
test-util = ["dep:tokio"]

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true

[lints]
workspace = true

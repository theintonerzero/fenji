[package]
name = "fenji-server"
description = "Fenji's server: the game gate, the account API and the admin commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
bevy_ecs.workspace = true
clap.workspace = true
fenji-auth.workspace = true
fenji-console = { workspace = true, features = ["tui"] }
fenji-proto.workspace = true
fenji-store.workspace = true
getrandom.workspace = true
if-addrs.workspace = true
rcgen.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# Plain lines read the console's commands from stdin (M4 hosting spec §3.1).
tokio = { workspace = true, features = ["io-std"] }
tokio-rustls.workspace = true
toml.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

# How SIGHUP was inherited, which std, tokio and rustix don't read (unix.rs).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
fenji-launcher.workspace = true
fenji-store = { workspace = true, features = ["test-util"] }
futures-util.workspace = true
lz4_flex.workspace = true
reqwest.workspace = true
tempfile.workspace = true
tower.workspace = true

# The attached console in a pseudo-terminal, and the signals sent to it (tests/console.rs).
[target.'cfg(unix)'.dev-dependencies]
rustix = { workspace = true, features = ["pty", "termios"] }

# The workspace's lints, but `unsafe_code` denied rather than forbidden, so that unix.rs alone may
# allow it: `sigaction` has no safe binding (the hosting plan's final review, Important 1).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[package]
name = "fenji-console"
description = "Fenji's host console: the protocol between a server and its consoles, and its front ends (full-screen and plain lines)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = ["tui"]
# The front ends: the full-screen console and plain lines. Without it, the crate is the wire protocol
# and the text checks, which the server and the launcher share (M4 hosting plan, Ruling HP3).
tui = ["dep:crossterm", "dep:futures-util", "dep:ratatui", "dep:rustix", "dep:tokio"]

[dependencies]
crossterm = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
ratatui = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }

# Stderr pointed away from the terminal while the full-screen console holds it, and its raw mode,
# which any thread can give back (tui.rs); the terminal's keys read (keys.rs).
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["stdio", "termios"], optional = true }

[dev-dependencies]
tokio.workspace = true

# A pseudo-terminal that hangs up, for the keys' reading (keys.rs).
[target.'cfg(unix)'.dev-dependencies]
rustix = { workspace = true, features = ["pty", "termios"] }

[lints]
workspace = true

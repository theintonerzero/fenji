[package]
name = "fenji-launcher"
description = "Fenji's launcher library and the fenji-launch CLI: sign-in, client verification and the launch spec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
fenji-auth.workspace = true
# Without its `tui` feature: the text checks the server and the host console use.
fenji-console.workspace = true
flate2.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tar.workspace = true
tokio = { workspace = true, features = ["process"] }
tracing.workspace = true
zip.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
axum.workspace = true
rcgen.workspace = true
tempfile.workspace = true
tokio-rustls.workspace = true
# Every thread's log, as text, for the test that no snapshot or log line holds a code line or the
# Steam account's name (#429).
tracing-subscriber.workspace = true
ts-rs.workspace = true

[lints]
workspace = true
